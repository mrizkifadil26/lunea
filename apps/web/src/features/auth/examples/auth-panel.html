<div class="auth-shell">

    <aside class="brand-panel">

        <div class="brand">
            <div class="brand-logo">
                <!-- Your 3/4 donut SVG goes here -->
                <svg viewBox="0 0 48 48" aria-hidden="true">
                    <defs>
                        <linearGradient id="logo-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="13%" stop-color="#38B9C5" />
                            <stop offset="42%" stop-color="#4787D1" />
                            <stop offset="62%" stop-color="#4285D4" />
                            <stop offset="77%" stop-color="#F2C45C" />
                        </linearGradient>
                    </defs>

                    <path d="M24 6
               A18 18 0 1 0 40 16
               L32 20
               A10 10 0 1 1 24 14
               Z" fill="url(#logo-gradient)" />
                </svg>
            </div>

            <span class="brand-name">Lunea</span>
        </div>


        <div class="brand-content">
            <span class="eyebrow">
                Welcome back
            </span>

            <h1>
                Build.<br />
                Collect.<br />
                Grow.
            </h1>

            <p>
                Everything you need to build and
                grow your product in one place.
            </p>
        </div>


        <div class="brand-decoration">
            <span></span>
            <span></span>
            <span></span>
        </div>

    </aside>


    <main class="auth-panel">

        <div class="auth-content">

            <header class="auth-header">
                <h2>Sign in</h2>

                <p>
                    Enter your details to access your account.
                </p>
            </header>


            <form class="auth-form">

                <div class="field">
                    <label for="email">
                        Email address
                    </label>

                    <input id="email" name="email" type="email" autocomplete="email" placeholder="you@example.com" />
                </div>


                <div class="field">
                    <div class="field-header">
                        <label for="password">
                            Password
                        </label>
                    </div>

                    <input id="password" name="password" type="password" autocomplete="current-password"
                        placeholder="Enter your password" />
                </div>


                <div class="form-options">

                    <label class="checkbox">
                        <input type="checkbox" name="remember" />

                        <span>
                            Remember me
                        </span>
                    </label>

                    <a href="#">
                        Forgot password?
                    </a>

                </div>


                <button class="button button-primary" type="submit">
                    <span>Sign in</span>
                    <span aria-hidden="true">→</span>
                </button>


                <div class="divider">
                    <span>or</span>
                </div>


                <button class="button button-secondary" type="button">
                    <span class="google-icon">G</span>
                    <span>Continue with Google</span>
                </button>

            </form>


            <footer class="auth-footer">
                <span>Don't have an account?</span>

                <a href="#">
                    Create account
                </a>
            </footer>

        </div>

    </main>

</div>
